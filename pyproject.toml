[project]
name = "iamarker"
version = "0.1.0"
description = "Herramienta CLI para interactuar con la API de Ollama y obtener respuestas en formato Markdown."
readme = "README.md"
authors = [
    { name = "Jorge-Marco5", email = "luismar1345@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "colorama==0.4.6",
    "halo==0.0.31",
    "log-symbols==0.0.14",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "pygments==2.20.0",
    "requests>=2.34.2",
    "rich==15.0.0",
    "simple-term-menu==1.6.6",
    "six==1.17.0",
    "spinners==0.0.24",
    "termcolor==3.3.0",
]

[project.scripts]
iamarker = "iamarker:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
